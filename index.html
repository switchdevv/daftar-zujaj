function pdfFromJpegs(imgs){/* imgs: [{w,h,bytes(Uint8Array jpeg)}] → Uint8Array PDF (A4) */
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;const push=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);len+=u.length};
  const obj=(n,body)=>{offs[n]=len;push(`${n} 0 obj\n`);if(Array.isArray(body))body.forEach(push);else push(body);push('\nendobj\n')};
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');const n=imgs.length,PW=595.28,PH=841.89,kids=[];
  for(let i=0;i<n;i++)kids.push(`${3+i*3} 0 R`);
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,`<< /Type /Pages /Count ${n} /Kids [${kids.join(' ')}] >>`);
  imgs.forEach((im,i)=>{const p=3+i*3,c=p+1,o=p+2,cs=`q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
    obj(p,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${o} 0 R >> >> /Contents ${c} 0 R >>`);
    obj(c,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    obj(o,[`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`,im.bytes,'\nendstream'])});
  const total=3+n*3,xref=len;let t=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let i=1;i<total;i++)t+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(t+`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  const out=new Uint8Array(len);let p=0;for(const u of parts){out.set(u,p);p+=u.length}return out;
}
async function stmtFile(){
  const pages=await stmtPages(),imgs=[];
  for(const cv of pages){const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.9));imgs.push({w:cv.width,h:cv.height,bytes:new Uint8Array(await blob.arrayBuffer())})}
  const c=stCli(stdraft.id)||{name:''},name=`releve-${String(c.name||'client').replace(/[\\/:*?"<>|\s]+/g,'-')}-${today()}.pdf`;
  return new File([pdfFromJpegs(imgs)],name,{type:'application/pdf'});
}

  const lbl=(u)=>{const out=[];const fw=Math.min(fs,u.w/4.2,u.h/1.6),fh=Math.min(fs,u.h/4.2,u.w/1.6);
    if(fw>=4.5)out.push(`<text x="${u.x+u.w/2}" y="${u.y+fw*1.05}" text-anchor="middle" dominant-baseline="hanging" font-size="${fw.toFixed(1)}" fill="var(--ink)" direction="ltr">${cf1(u.w)}</text>`);
    if(fh>=4.5)out.push(`<text transform="translate(${u.x+fh*1.05} ${u.y+u.h/2}) rotate(-90)" text-anchor="middle" dominant-baseline="hanging" font-size="${fh.toFixed(1)}" fill="var(--ink)" direction="ltr">${cf1(u.h)}</text>`);
    if(u.lab){const fl=Math.min(fs*.95,u.w/Math.max(4,u.lab.length*0.62),u.h/3);if(fl>=4.5)out.push(`<text x="${u.x+u.w/2}" y="${u.y+u.h/2}" text-anchor="middle" dominant-baseline="central" font-size="${fl.toFixed(1)}" font-weight="700" fill="var(--accent)">${esc(u.lab)}</text>`)}
    return out.join('')};
  const off=s.free.map(f=>{const ff=Math.min(fs*.85,f.w/4.5,f.h/2.2);return `<rect x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" fill="url(#hatch${i})" stroke="var(--faint)" stroke-width="${(M/600).toFixed(2)}"/>${ff>=4.5?`<text x="${f.x+f.w/2}" y="${f.y+f.h/2}" text-anchor="middle" dominant-baseline="central" font-size="${ff.toFixed(1)}" fill="var(--faint)" direction="ltr">${cf1(f.w)}×${cf1(f.h)}</text>`:''}`}).join('');
  const sw=(M/320).toFixed(2);
  return `<svg viewBox="${-pad} ${-pad} ${SW+pad*2} ${SH+pad*2}" role="img" aria-label="${tr('مخطط اللوح','Plan de la plaque')} ${i+1}">
  <defs><pattern id="hatch${i}" patternUnits="userSpaceOnUse" width="${(M/60).toFixed(1)}" height="${(M/60).toFixed(1)}" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="${(M/60).toFixed(1)}" stroke="var(--faint)" stroke-width="${(M/700).toFixed(2)}" opacity=".55"/></pattern></defs>
  <rect x="0" y="0" width="${SW}" height="${SH}" fill="var(--sunk)" stroke="var(--ink)" stroke-width="${sw}"/>
  ${off}
  ${s.used.map(u=>`<rect x="${u.x}" y="${u.y}" width="${u.w}" height="${u.h}" fill="var(--edge)" stroke="var(--accent)" stroke-width="${sw}"/>${lbl(u)}`).join('')}
  <line x1="0" y1="${-pad*.3}" x2="${SW}" y2="${-pad*.3}" stroke="var(--debt)" stroke-width="${sw}"/><text x="${SW/2}" y="${-pad*.45}" text-anchor="middle" font-size="${fs.toFixed(1)}" fill="var(--debt)" direction="ltr">${cf1(SW)}</text>
  <line x1="${SW+pad*.3}" y1="0" x2="${SW+pad*.3}" y2="${SH}" stroke="var(--debt)" stroke-width="${sw}"/><text transform="translate(${SW+pad*.45} ${SH/2}) rotate(-90)" text-anchor="middle" dominant-baseline="hanging" font-size="${fs.toFixed(1)}" fill="var(--debt)" direction="ltr">${cf1(SH)}</text>
  </svg>`;
}

      <p class="note" style="margin:6px 0 0">${tr('x = قصّة بالعرض من اليسار، y = قصّة بالطول من الأعلى. القطعة الجاهزة بالخط العريض.','x = coupe depuis la gauche, y = depuis le haut. Pièce finie en gras.')}</p></details>
    </div>`}).join('')}`;

  const name=(f.name||'').toLowerCase(),buf=new Uint8Array(await f.arrayBuffer());
  const info=(t,b)=>ask({title:t,body:b,ok:tr('فهمت','Compris'),cancel:false,danger:false,icon:'doc'});

  return txt;
}
const normName=s=>String(s||'').trim().replace(/\s+/g,' ').toLowerCase();
function parseCSV(text){
  text=String(text||'').replace(/^﻿/,'').replace(/```[a-z]*\n?/gi,'').trim();if(!text)return[];
  const first=text.split(/\r?\n/)[0];const sep=[',',';','\t','،'].map(s=>[s,first.split(s).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let cur=[''],q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur[cur.length-1]+='"';i++}else q=false}else cur[cur.length-1]+=ch;continue}
    if(ch==='"'){q=true;continue}
    if(ch===sep){cur.push('');continue}
    if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;rows.push(cur);cur=[''];continue}
    cur[cur.length-1]+=ch}
  rows.push(cur);
  const money=v=>{let s=String(v||'').replace(/[^\d.,-]/g,'');if(/[.,]\d{1,2}$/.test(s))s=s.replace(/[.,]\d{1,2}$/,'');return s.replace(/[.,]/g,'')};
  const out=[];
  for(const r of rows){const c=r.map(x=>String(x).trim());if(!c.some(Boolean))continue;
    if(BAD_RE.test(c.join('')))continue; /* binary garbage */
    let [name,phone,debt,...rest]=c;
    if(c.length===2){debt=c[1];phone=''}
    const d=money(debt);
    if(!name||name.length>60||!/\d/.test(d||''))continue; /* header or junk */
    phone=String(phone||'').replace(/[^\d+ ]/g,'').trim();if(phone.replace(/\D/g,'').length>15)phone='';
    const big=num(d)>=1e8;
    out.push({name,phone,debt:d,note:(rest.join(' ').trim()+(big?' '+tr('(تحقق: المبلغ كبير جداً)','(à vérifier : montant très élevé)'):'')).trim(),on:!big});
  }
  return out;
}

function cashDayData(d){const isCash=m=>!m||m==='cash';let cin=0,cout=0;const nonc=[];
  for(const p of cashPays())if(p.date===d){if(isCash(p.method))cin+=num(p.amount);else nonc.push({l:((S.clients[p.clientId]||{}).name||p.cname||'?')+' · '+payMName(p.method),a:num(p.amount)})}
  for(const b of Object.values(S.bons))if(b.walkin&&b.date===d){const v=num(b.total);if(v>0){if(isCash(b.pmeth))cin+=walkPaid0(b);else if(walkPaid0(b)>0)nonc.push({l:custName(b)+' · '+payMName(b.pmeth),a:walkPaid0(b)})}else cout+=-v}for(const b of Object.values(S.bons))for(const w of cashW(b))if(w.date===d)cin+=num(w.amount);
  for(const e of Object.values(S.exps))if(e.date===d)cout+=num(e.amount);
  for(const x of Object.values(S.spays))if(x.date===d&&isCash(x.method))cout+=num(x.amount);
  for(const m of Object.values(S.stock))if(m.kind==='in'&&m.date===d)cout+=num(m.paid);
  for(const m of Object.values(S.amv))if(m.kind==='in'&&m.date===d)cout+=num(m.paid);
  let opening=0,od='';for(const [k,c] of Object.entries(S.closings||{}))if(k<d&&k>od){od=k;opening=num(c.left)}
  return{cin,cout,nonc,opening,od,expected:opening+cin-cout}}

function poNext(){if(!poQueue)return false;const it=poQueue.items.shift();
  if(!it){const id=poQueue.id;poQueue=null;go('poview',{id});setTimeout(()=>toast(tr('تم تسجيل كل الطلبية في المخزون.','Toute la commande est en stock.')),300);return true}
  const po=(S.porders||{})[poQueue.id]||{},sid=po.supplierId&&S.sups[po.supplierId]?po.supplierId:'';
  if(it.k==='g'){const t=types().find(x=>x.id===it.id);if(!t)return poNext();const e2=S.sk[t.id];
    kdraft={supplierId:sid,paid:'',typeId:t.id,date:today(),sheets:String(it.qty||''),sw:String(num(it.sw)||(e2&&e2.last?e2.last.sw:SHEET0.w)),sh:String(num(it.sh)||(e2&&e2.last?e2.last.sh:SHEET0.h)),costM2:e2&&e2.last?String(e2.last.costM2):'',sell:String(t.price),mm:String(mmOf(t.id)||''),supplier:''};go('kin')}
  else{const x=S.arts[it.id];if(!x||!artTracked(x))return poNext();aind={articleId:it.id,u:'base',qty:String(it.qty||''),uc:num(x.cost)>0?String(num(x.cost)):'',date:today(),supplierId:sid,newSup:'',paid:'',back:''};go('ain')}
  setTimeout(()=>toast(`${tr('طلبية','Commande')} ${po.num||''} · ${tr('سطر','ligne')} ${poQueue?poQueue.n-poQueue.items.length:''}/${poQueue?poQueue.n:''}`),300);return true}

async function cancelForm33(v){
  if(v==='apform'){const r=apd&&apd.ret;apd=null;if(r&&r.name&&r.name!=='apform')go(r.name,r.id?{id:r.id}:{});else go('appts');return true}
  if(v==='wpedit'){const k=wpd&&wpd.key;wpd=null;if(k&&personOf(k))go('wperson',{id:k});else{ctab='walk';go('clients')}return true}
  if((v==='kin'||v==='ain')&&poQueue){const id=poQueue.id;poQueue=null;kdraft=null;aind=null;go('poview',{id});return true}
  if(v==='pay'&&pdraft&&pdraft.ret==='collect'){pdraft=null;go('collect');return true}
  if(v==='close'){cldraft=null;go('cash');return true}
  if(v==='poform'){const e=podraft&&podraft.editId;podraft=null;e?go('poview',{id:e}):go('pos');return true}
  if(v==='staff'){staffd=null;go('set');return true}
  return false}
function render33(v){return v==='pex'?pexHTML():v==='appts'?apptsHTML():v==='apform'?apFormHTML():v==='orders'?ordersHTML():v==='calc'?calcHTML():v==='wperson'?wpersonHTML():v==='wpedit'?wpeditHTML():v==='collect'?collectHTML():v==='close'?closeHTML():v==='staff'?staffHTML():v==='pos'?posHTML():v==='poform'?poFormHTML():v==='poview'?poViewHTML():null}

    .sort((a,b)=>(b.pin-a.pin)||(b.owe>0.5)-(a.owe>0.5)||(a.last<b.last?1:a.last>b.last?-1:0));

function qsugUpdate(){const box=$('#qsug'),i=$('#q');if(!box||!i)return;const q=i.value.trim().toLowerCase(),dq=digits(q);
  if(!q||(/^\d+$/.test(q)&&dq.length<2)){box.hidden=true;box.innerHTML='';return}
  let items=[];
  if(ctab==='walk')items=Object.values(walkPeople()).filter(p=>nameStarts(p.name,q)||p.name.toLowerCase().includes(q)||(dq.length>=2&&digits(p.phone).includes(dq.replace(/^0/,'')))).map(p=>({act:'open-wp',id:p.key,name:p.name,sub:p.phone,amt:p.owe,st:nameStarts(p.name,q)}));
  else items=Object.entries(S.clients).filter(([,c])=>cMatch(c,q)).map(([id,c])=>({act:'open-client',id,name:c.name,sub:[c.owner,c.phone].filter(Boolean).join(' · '),amt:(S.stats[id]||{}).bal||0,st:nameStarts(c.name,q)}));
  items.sort((a,b)=>b.st-a.st||b.amt-a.amt);items=items.slice(0,6);
  if(!items.length){box.hidden=true;box.innerHTML='';return}
  box.innerHTML=items.map(x=>`<button class="qs-row" data-act="${x.act}" data-id="${esc(x.id)}"><b>${esc(x.name)}</b><span class="note">${esc(x.sub||'')}</span>${x.amt>0.5?`<span class="amt neg">${DA(x.amt)}</span>`:''}</button>`).join('');box.hidden=false}

      await db.collection('stock').doc().set({kind:'in',typeId:ty.id,type:ty.name,date:kdraft.date||today(),sheets:num(kdraft.sheets),sw:num(kdraft.sw),sh:num(kdraft.sh),area:Math.round(c.area*10000)/10000,costM2:num(kdraft.costM2),mm:mmN,cost:c.cost,supplierId:sid,supplier:sname,paid:sid?Math.min(c.cost,Math.round(num(kdraft.paid))):0,createdAt:Date.now()});
      if(newTypes)await saveSettings({types:newTypes})},newTypes?tr('تم تسجيل السلعة وتحديث سعر البيع.','Entrée enregistrée, prix de vente mis à jour.'):tr('تم تسجيل السلعة.','Entrée enregistrée.'));
    if(ok){kdraft=null;if(!poNext())go('stock')}return}
  if(a==='save-adj'){
    if(adraft.real==='')return toast(tr('اكتب الكمية الموجودة.','Saisissez le stock réel.'));const e2=S.sk[adraft.typeId]||{bal:0};const d=Math.round((num(adraft.real)-e2.bal)*10000)/10000;
    if(Math.abs(d)<0.0001)return toast(tr('لا يوجد فرق.','Aucun écart.'));const ty=types().find(x=>x.id===adraft.typeId)||{name:e2.name};
    if(await write(()=>db.collection('stock').doc().set({kind:'adj',typeId:adraft.typeId,type:ty.name,date:adraft.date||today(),area:d,note:adraft.note.trim(),createdAt:Date.now()}),tr('تم حفظ التعديل.','Ajustement enregistré.'))){adraft=null;go('stock')}return}
  if(a==='del-mv'){const m=S.stock[id];if(!m)return;
    if(!await ask({title:m.kind==='in'?tr('حذف دخول السلعة؟','Supprimer cette entrée ?'):tr('حذف تعديل الجرد؟','Supprimer cet ajustement ?'),ok:tr('حذف','Supprimer'),
      body:`${esc(m.type)} · ${M2(Math.abs(num(m.area)))} · ${fdate(m.date)}<br>${tr('سيتغير رصيد المخزون لهذا النوع.','Le stock de ce type sera recalculé.')}`}))return;
    await removeDocs(['stock/'+id],tr('تم حذف الحركة','Mouvement supprimé'));return}
  if(a==='del-pay'){const p=S.pays[id];if(!p)return;
    if(!await ask({title:tr('حذف هذا الفارسمو؟','Supprimer ce versement ?'),ok:tr('حذف','Supprimer'),body:`${DA(p.amount)} · ${fdate(p.date)}<br>${tr('سيرتفع دين الحرفي بنفس المبلغ.','Le crédit du client augmentera du même montant.')}`}))return;
    const wasEdit=view.name==='pay';await removeDocs(['payments/'+id],tr('تم حذف الفارسمو','Versement supprimé'));if(wasEdit){pdraft=null;go('client',{id:p.clientId})}return}
  if(a==='del-bon'){const bon=S.bons[id];if(!bon)return;const cid=bon.clientId;const linked=Object.keys(S.pays).filter(p=>S.pays[p].bonId===id);const rets=Object.keys(S.bons).filter(k=>S.bons[k].refOf===id);const lp=linked.reduce((s,p)=>s+num(S.pays[p].amount),0);
    const area=(bon.lines||[]).reduce((s,l)=>s+num(l.area),0);
    if(!await ask({title:bon.kind==='opening'?tr('حذف الدين القديم؟','Supprimer l’ancien crédit ?'):tr(`حذف الفاتورة رقم ${bon.num}؟`,`Supprimer la facture n° ${bon.num} ?`),ok:tr('حذف','Supprimer'),
      body:`<p style="margin:0 0 6px;font-weight:600">${tr('هل أنت متأكد؟','Êtes-vous sûr ?')}</p><ul><li>${tr('المبلغ','Montant')}: ${DA(bon.total)}</li>${area&&bon.kind!=='return'?`<li>${tr('يرجع إلى المخزون','Retour en stock')}: ${M2(area)}</li>`:''}${rets.length?`<li>${tr('تُحذف معها المرتجعات المرتبطة بها','Retours liés supprimés')}: ${rets.length}</li>`:''}${lp?`<li>${tr('يُحذف معها الدفع المرتبط بها','Paiement lié supprimé aussi')}: ${DA(lp)}</li>`:''}</ul><p style="margin:8px 0 0">${tr('يمكنك التراجع بعد الحذف مباشرة.','Vous pourrez annuler juste après.')}</p>`}))return;
    if(await removeDocs([...linked.map(p=>'payments/'+p),...rets.map(k=>'bons/'+k),'bons/'+id],tr('تم حذف الفاتورة','Facture supprimée'))){if(cid)go('client',{id:cid});else{const pk=pkey(bon.cname,bon.cphone);if(personOf(pk))go('wperson',{id:pk});else{ctab='walk';go('clients')}}}return}
  if(a==='del-client'){const c=S.clients[id];if(!c)return;
    const bs=Object.keys(S.bons).filter(x=>S.bons[x].clientId===id),ps=Object.keys(S.pays).filter(x=>S.pays[x].clientId===id);const st=S.stats[id]||{bal:0};
    if(!await ask({title:tr(`حذف «${esc(c.name)}» نهائياً؟`,`Supprimer « ${esc(c.name)} » ?`),ok:tr('حذف الحرفي','Supprimer le client'),
      body:`<p style="margin:0 0 6px;font-weight:600">${tr('هل أنت متأكد؟','Êtes-vous sûr ?')}</p><ul><li>${bs.length} ${tr('فاتورة','factures')}، ${ps.length} ${tr('دفعة','paiements')}</li><li>${tr('الدين الحالي','Crédit actuel')}: ${DA(st.bal)}</li><li>${tr('الزجاج المباع لها يرجع إلى المخزون.','Le verre vendu revient en stock.')}</li></ul>
      ${st.bal>0?`<p style="margin:8px 0 0;color:var(--debt);font-weight:600">${tr('تنبيه: على هذا الحرفي دين لم يُسدَّد.','Attention : ce client a un crédit non soldé.')}</p>`:''}`}))return;
    if(await removeDocs([...ps.map(p=>'payments/'+p),...bs.map(x=>'bons/'+x),'clients/'+id],tr(`تم حذف «${c.name}»`,`« ${c.name} » supprimé`)))go('clients');return}
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){if(prefs.lock===0&&unlocked&&S.auth){/* lock on next open */endSession();}else touch(true)}
  else if(S.auth&&$('#gate').hidden&&!sessionValid()){lockNow()}
});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(view.name==='set'&&$('#gate').hidden)render()});
window.addEventListener('appinstalled',()=>{installEvt=null;toast(tr('تم تثبيت التطبيق.','Application installée.'))});

/* ====================== boot ====================== */
applyPrefs();
(async()=>{
  try{if(!window.indexedDB||!window.crypto||!crypto.subtle)throw 0;await LocalDB.load()}
  catch(e){$('#boot').innerHTML=`<div class="gate-card"><div class="gate-head">${MARK}<b dir="ltr">Guessoum Glass</b></div><p class="note">${tr('هذا المتصفح لا يسمح بحفظ البيانات. افتح التطبيق في Chrome أو Safari، دون الوضع الخفي.','Ce navigateur ne permet pas d’enregistrer les données. Ouvrez l’application dans Chrome ou Safari, hors navigation privée.')}</p></div>`;return}
  db=LocalDB;dbState='ok';LocalDB.setHook(markOut);LocalDB.setEvtHook(evHook);cloudBoot();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(_){}
  const asMap=q=>Object.fromEntries(q.docs.map(d=>[d.id,d.data()]));
  bootRf=true;
  db.doc('auth/main').onSnapshot(s=>{S.auth=s.exists?s.data():null;S.ok.a=true;refresh()});
  db.doc('settings/main').onSnapshot(s=>{const d=s.exists?s.data():{};S.types=Array.isArray(d.types)&&d.types.length?d.types:null;S.shop=d.shop||{};S.svcs=Array.isArray(d.svcs)?d.svcs:null;S.minArea=d.minArea||0;S.feat=d.feat||{};refresh()});
  db.collection('quotes').onSnapshot(q=>{S.quotes=asMap(q);refresh()});
  db.collection('offcuts').onSnapshot(q=>{S.offc=asMap(q);refresh()});
  db.collection('closings').onSnapshot(q=>{S.closings=asMap(q);refresh()});
  db.collection('porders').onSnapshot(q=>{S.porders=asMap(q);refresh()});
  db.collection('expenses').onSnapshot(q=>{S.exps=asMap(q);refresh()});
  db.collection('notes').onSnapshot(q=>{S.notes=asMap(q);if(['notes','nform','home'].includes(view.name))refresh()});
  db.collection('wmeta').onSnapshot(q=>{S.wmeta=asMap(q);refresh()});
  db.collection('appts').onSnapshot(q=>{S.appts=asMap(q);refresh()});
  db.collection('pexp').onSnapshot(q=>{S.pexp=asMap(q);if(['home','pex'].includes(view.name))render()});
  db.collection('pset').onSnapshot(q=>{S.pset=asMap(q);if(['home','pex'].includes(view.name))render()});
  db.collection('devices').onSnapshot(q=>{S.devs=asMap(q);if(view.name==='cloud'&&$('#gate').hidden)render()});
  db.collection('cnotes').onSnapshot(q=>{S.cnotes=asMap(q);if(['client','wperson'].includes(view.name))refresh()});
  db.collection('suppliers').onSnapshot(q=>{S.sups=asMap(q);refresh()});
  db.collection('spays').onSnapshot(q=>{S.spays=asMap(q);refresh()});
  db.collection('articles').onSnapshot(q=>{S.arts=asMap(q);refresh()});
  db.collection('amoves').onSnapshot(q=>{S.amv=asMap(q);refresh()});
  db.collection('events').onSnapshot(q=>{S.evs=asMap(q);if(view.name==='events')refresh()});
  db.collection('clients').onSnapshot(q=>{S.clients=asMap(q);S.ok.c=true;refresh()});
  db.collection('bons').onSnapshot(q=>{S.bons=asMap(q);S.ok.b=true;refresh()});
  db.collection('payments').onSnapshot(q=>{S.pays=asMap(q);S.ok.p=true;refresh()});
  db.collection('stock').onSnapshot(q=>{S.stock=asMap(q);S.ok.k=true;refresh()});
  setTimeout(()=>{bootRf=false;refresh()},0);
})();
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  const hadCtl=!!navigator.serviceWorker.controller;let reloading=false;
  const busy=()=>['close','poform','staff','bon','pay','cform','kin','kadj','exp','ret','sform','spay','prices','shop','acct','import','svcs','odebt','climit','cprice','nform','tedit','me','dnote'].includes(view&&view.name);
  const doReload=()=>{if(reloading)return;reloading=true;location.reload()};
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtl)return;
    if(!busy())return doReload();
    toast(tr('تحديث جديد جاهز، يُطبَّق عند إنهاء هذه الصفحة.','Mise à jour prête, appliquée après ce formulaire.'));
    const t=setInterval(()=>{if(!busy()){clearInterval(t);doReload()}},1500)});
  const SW_URL=(()=>{try{const v=+localStorage.getItem('gg-swv')||0;return v>=APP_VER&&v>0?'sw.js?v='+v:'sw.js'}catch(_){return 'sw.js'}})();
  /* تحديث فوري: ver.json يتجاوز cache تاع GitHub (10 دقايق) */
  let verBusy=false;
  const verCheck=()=>{if(!navigator.onLine||verBusy)return Promise.resolve(0);verBusy=true;return fetch('ver.json?_='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{const v=j&&+j.v||0;if(v>APP_VER){try{localStorage.setItem('gg-swv',String(v))}catch(_){}
      return navigator.serviceWorker.register('sw.js?v='+v,{updateViaCache:'none'}).then(()=>v).catch(()=>v)}return v}).catch(()=>0).finally(()=>{verBusy=false})};
  window.addEventListener('load',()=>{navigator.serviceWorker.register(SW_URL,{updateViaCache:'none'}).then(reg=>{
    const chk=()=>{if(!navigator.onLine)return;verCheck().then(v=>{if(!(v>APP_VER))reg.update().catch(()=>{})})};chk();
    if(!navigator.serviceWorker.controller&&reg.active&&!sessionStorage.getItem('gg-ctl')){try{sessionStorage.setItem('gg-ctl','1')}catch(_){}setTimeout(()=>{if(!navigator.serviceWorker.controller)location.reload()},800)}
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')chk()});
    setInterval(chk,30*60*1000)}).catch(()=>{})})}
